[workspace]
members = ["json_schema_rs", "json_schema_rs_macro", "jsonschemars", "json_schema_rs_benchmark", "json_schema_rs_differential"]
# Its own workspace, built apart so its competitors' dependency features never reach ours.
exclude = ["json_schema_rs_benchmark/isolated"]
resolver = "3"

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.100"
authors = ["Todd Everett Griffin <tgriffin115@gmail.com>"]
readme = "README.md"
repository = "https://github.com/goddtriffin/json-schema-rs"
homepage = "https://www.toddgriffin.me/"
description = "A Rust library to generate Rust structs from JSON Schema."
license-file = "LICENSE"
keywords = ["json", "schema", "json-schema", "rust", "structs"]
categories = ["parsing"]
exclude = [".idea/*", ".github/*"]

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Every dependency of every member, declared once here at its full version; members inherit
# them (`name.workspace = true`) and add only their own features and `optional`.
[workspace.dependencies]
json-schema-rs = { version = "0.0.6", path = "json_schema_rs" }

boon = "0.6.1"
clap = "4.6.7"
criterion = "0.8.2"
fluent-uri = "0.4.1"
heck = "0.5.0"
indexmap = "2.14.2"
jsonschema = { version = "0.61.2", default-features = false }
jsonschema-valid = "0.5.2"
jsonschema_code_generator = "2.0.0"
libtest-mimic = "0.8.2"
log = "0.4.35"
memchr = "2.8.3"
num-bigint = "0.5.1"
peak_alloc = "0.3.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regress = "0.12.0"
reqwest = "0.13.5"
schemafy_lib = "0.6.0"
# The version typify (whose latest release is 0.8) takes in its API; the isolated benchmark
# workspace links the latest schemars as a competitor.
schemars = "0.8.22"
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = "3.0.10"
tempfile = "3.27.0"
typify = { version = "0.8.0", default-features = false }
url = "2.5.8"
# `format: "date-time"` / `"date"` types (the `chrono` feature); no clock or time zone database.
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
valico = "4.0.0"
