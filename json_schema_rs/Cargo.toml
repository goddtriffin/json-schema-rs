[package]
name = "json-schema-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "jsonschemars"
path = "src/main.rs"

[lints]
workspace = true

[features]
uuid = ["dep:uuid"]
# Retrieve `http:` / `https:` documents a `$ref` names (`HttpRetriever`, the CLI's
# `--cgs-allow-remote-refs`). Off by default: no network access unless asked for.
http = ["dep:reqwest"]

[dependencies]
clap = { version = "4", features = ["derive"] }
# RFC 3986 / 3987 URI parsing, reference resolution and normalisation for `$id` / `$ref`.
fluent-uri = "0.4"
heck = "0.5"
log.workspace = true
# SIMD substring search for the draft-4 parse prefilter (already in the tree via serde_json).
memchr = "2.7"
regress = "0.10"
reqwest = { version = "0.13", optional = true, features = ["blocking"] }
serde.workspace = true
# `float_roundtrip`: parse every float to the nearest `f64` (the default parser can be one ULP off),
# so numbers written by this crate read back exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid = { workspace = true, optional = true }

[dev-dependencies]
libtest-mimic = "0.8"
tempfile = "3"

[[test]]
name = "json_schema_test_suite"
harness = false
