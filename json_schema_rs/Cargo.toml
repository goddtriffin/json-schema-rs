[package]
name = "json-schema-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
uuid = ["dep:uuid"]
# Retrieve `http:` / `https:` documents a `$ref` names (`HttpRetriever`, the CLI's
# `--cgs-allow-remote-refs`). Off by default: no network access unless asked for.
http = ["dep:reqwest"]
# `UniqueItemsType::IndexSet` (codegen emits `indexmap::IndexSet` for `uniqueItems` arrays) and
# `ToJsonSchema for IndexSet`. Off by default: generated code then needs no extra crate.
indexmap = ["dep:indexmap"]
# Exact numbers beyond 64 bits: `serde_json/arbitrary_precision` keeps every number as written,
# and comparison, `multipleOf`, `const` / `enum` / `uniqueItems` and the integer rule work on the
# exact decimal. Off by default: Cargo feature unification turns `serde_json`'s feature on for
# every crate in the build (see design.md, *Numbers*).
arbitrary-precision = ["serde_json/arbitrary_precision", "dep:num-bigint"]

[dependencies]
# RFC 3986 / 3987 URI parsing, reference resolution and normalisation for `$id` / `$ref`.
fluent-uri.workspace = true
heck.workspace = true
indexmap = { workspace = true, optional = true }
log.workspace = true
# SIMD substring search for the draft-4 parse prefilter (already in the tree via serde_json).
memchr.workspace = true
# Big-integer mantissas for exact decimal arithmetic under `arbitrary-precision`.
num-bigint = { workspace = true, optional = true }
regress.workspace = true
reqwest = { workspace = true, optional = true, features = ["blocking"] }
serde.workspace = true
# `float_roundtrip`: parse every float to the nearest `f64` (the default parser can be one ULP off),
# so numbers written by this crate read back exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid = { workspace = true, optional = true }

[dev-dependencies]
libtest-mimic.workspace = true
tempfile.workspace = true

[[test]]
name = "json_schema_test_suite"
harness = false
