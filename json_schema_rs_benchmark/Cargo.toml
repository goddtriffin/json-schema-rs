[package]
name = "json-schema-rs-benchmark"
description = "Benchmark harness comparing json-schema-rs against competitor JSON Schema libraries. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Aggregator: reads criterion + /usr/bin/time output and emits results.{json,md}.
[[bin]]
name = "aggregate"
path = "src/bin/aggregate.rs"

# Thin CLI wrapper around the `boon` validator so the harness can time it like any other tool.
[[bin]]
name = "boon_validate"
path = "src/bin/boon_validate.rs"

# In-process criterion micro-benchmarks of OUR hot paths (parse->compile, validate, codegen).
[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true

[dependencies]
json-schema-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
boon = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

# Enables dhat heap profiling in the criterion benches (opt-in; swaps the global allocator).
[features]
dhat-heap = []
