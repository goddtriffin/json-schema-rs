[package]
name = "json-schema-rs-benchmark"
description = "Benchmark harness comparing json-schema-rs against competitor JSON Schema libraries. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Aggregator: reads the raw captures of both tiers and emits results.{json,md}.
[[bin]]
name = "aggregate"
path = "src/bin/aggregate.rs"

# Thin CLI wrapper around the `boon` validator so the CLI tier can time it like any other tool.
[[bin]]
name = "boon_validate"
path = "src/bin/boon_validate.rs"

# Deterministic generator for the large synthetic fixtures (written under target/, never committed).
[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

# In-process peak-heap profile of every (tool, fixture, operation) under a counting allocator;
# also the authoritative in-process compatibility check.
[[bin]]
name = "heap_profile"
path = "src/bin/heap_profile.rs"

# Prints the fixture set (id, dir, external refs) so the CLI tier discovers exactly what the
# in-process tier does.
[[bin]]
name = "list_fixtures"
path = "src/bin/list_fixtures.rs"

# In-process criterion timing of every tool (linked as a library) on every fixture.
[[bench]]
name = "cross_tool"
harness = false

[lints]
workspace = true

[dependencies]
json-schema-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = "4"
fluent-uri = "0.4"
boon = "0.6"
jsonschema = { version = "0.60", default-features = false }
typify = { version = "0.8", default-features = false }
schemars = "0.8"
syn = "3"
prettyplease = "0.3"
peak_alloc = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
