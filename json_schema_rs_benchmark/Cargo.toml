[package]
name = "json-schema-rs-benchmark"
description = "Benchmark harness comparing json-schema-rs against competitor JSON Schema libraries. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Aggregator: reads the raw captures of both tiers and emits results.{json,md}.
[[bin]]
name = "aggregate"
path = "src/bin/aggregate.rs"

# Thin CLI wrapper around the `boon` validator so the CLI tier can time it like any other tool.
[[bin]]
name = "boon_validate"
path = "src/bin/boon_validate.rs"
required-features = ["tools"]

# The quick benchmark's report: our tool's cells on a base commit vs the working tree.
[[bin]]
name = "compare"
path = "src/bin/compare.rs"

# Our codegen's generated code size per fixture (lines, bytes, types, categories): code_size.tsv.
[[bin]]
name = "code_size"
path = "src/bin/code_size.rs"

# A copy of an executable whose identity differs (a rewritten Mach-O UUID), so the quick mode's
# CLI rounds each run their own build identity (#123).
[[bin]]
name = "binary_variant"
path = "src/bin/binary_variant.rs"

# Deterministic generator for the large synthetic fixtures (written under target/, never committed).
[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

# In-process peak-heap profile of every (tool, fixture, operation) under a counting allocator;
# also the authoritative in-process compatibility check.
[[bin]]
name = "heap_profile"
path = "src/bin/heap_profile.rs"
required-features = ["tools"]

# Triage of a failed reverse-codegen models build: cargo JSON messages in, the models that do not
# compile out (see src/models.rs).
[[bin]]
name = "model_build_failures"
path = "src/bin/model_build_failures.rs"

# Prints the fixture set (id, dir, external refs) so the CLI tier discovers exactly what the
# in-process tier does.
[[bin]]
name = "list_fixtures"
path = "src/bin/list_fixtures.rs"

# In-process criterion timing of every tool (linked as a library) on every fixture.
[[bench]]
name = "cross_tool"
harness = false
required-features = ["tools"]

[lints]
workspace = true

[features]
default = ["tools"]
# Every tool this crate links (and the binaries that run them). Off only for `isolated/`, which
# reuses the fixture discovery and the generic harness without building these tools.
tools = [
    "dep:json-schema-rs",
    "dep:boon",
    "dep:jsonschema",
    "dep:typify",
    "dep:schemars",
    "dep:prettyplease",
    "dep:proc-macro2",
    "dep:valico",
    "dep:url",
    "dep:jsonschema-valid",
    "dep:self_cell",
    "dep:schemafy_lib",
    "dep:jsonschema_code_generator",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
fluent-uri.workspace = true
peak_alloc.workspace = true
syn = { workspace = true, features = ["full"] }
json-schema-rs = { workspace = true, optional = true }
boon = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
typify = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
valico = { workspace = true, optional = true }
url = { workspace = true, optional = true }
jsonschema-valid = { workspace = true, optional = true }
self_cell = { workspace = true, optional = true }
schemafy_lib = { workspace = true, optional = true }
jsonschema_code_generator = { workspace = true, optional = true }
