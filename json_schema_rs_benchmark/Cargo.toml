[package]
name = "json-schema-rs-benchmark"
description = "Benchmark harness comparing json-schema-rs against competitor JSON Schema libraries. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Aggregator: reads the raw captures of both tiers and emits results.{json,md}.
[[bin]]
name = "aggregate"
path = "src/bin/aggregate.rs"

# Thin CLI wrapper around the `boon` validator so the CLI tier can time it like any other tool.
[[bin]]
name = "boon_validate"
path = "src/bin/boon_validate.rs"
required-features = ["tools"]

# Deterministic generator for the large synthetic fixtures (written under target/, never committed).
[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

# In-process peak-heap profile of every (tool, fixture, operation) under a counting allocator;
# also the authoritative in-process compatibility check.
[[bin]]
name = "heap_profile"
path = "src/bin/heap_profile.rs"
required-features = ["tools"]

# Triage of a failed reverse-codegen models build: cargo JSON messages in, the models that do not
# compile out (see src/reverse_models.rs).
[[bin]]
name = "model_build_failures"
path = "src/bin/model_build_failures.rs"

# Prints the fixture set (id, dir, external refs) so the CLI tier discovers exactly what the
# in-process tier does.
[[bin]]
name = "list_fixtures"
path = "src/bin/list_fixtures.rs"

# In-process criterion timing of every tool (linked as a library) on every fixture.
[[bench]]
name = "cross_tool"
harness = false
required-features = ["tools"]

[lints]
workspace = true

[features]
default = ["tools"]
# Every tool this crate links (and the binaries that run them). Off only for `isolated/`, which
# reuses the fixture discovery and the generic harness without building these tools.
tools = [
    "dep:json-schema-rs",
    "dep:boon",
    "dep:jsonschema",
    "dep:typify",
    "dep:schemars",
    "dep:prettyplease",
    "dep:proc-macro2",
    "dep:valico",
    "dep:url",
    "dep:jsonschema-valid",
    "dep:self_cell",
    "dep:schemafy_lib",
    "dep:jsonschema_code_generator",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = "4"
criterion = { version = "0.5", features = ["html_reports"] }
fluent-uri = "0.4"
peak_alloc = "0.3"
syn = { version = "3", features = ["full"] }
json-schema-rs = { workspace = true, optional = true }
boon = { version = "0.6", optional = true }
jsonschema = { version = "0.60", default-features = false, optional = true }
typify = { version = "0.8", default-features = false, optional = true }
schemars = { version = "0.8", optional = true }
prettyplease = { version = "0.3", optional = true }
proc-macro2 = { version = "1", optional = true }
valico = { version = "4", optional = true }
url = { version = "2", optional = true }
jsonschema-valid = { version = "0.5", optional = true }
self_cell = { version = "1", optional = true }
schemafy_lib = { version = "0.6", optional = true }
jsonschema_code_generator = { version = "2", optional = true }
