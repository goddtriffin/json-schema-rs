# Benchmark competitors that must be built apart from the main benchmark crate, each in a build
# of its own (see design.md, *Benchmark harness*):
#
# - `corvus`: corvus-json-schema turns on serde_json's `preserve_order`, which Cargo would also
#   turn on for json-schema-rs and every other tool if they shared a build.
# - `jsonschema-macros`: jsonschema's compile-time validators, one per fixture, generated by
#   build.rs from the fixture set, which only exists once the driver has generated it.
# - `reverse-codegen`: reverse codegen (Rust types -> JSON Schema) by our `ToJsonSchema` derive and
#   by schemars, on models generated from the fixture set with our codegen: one copy per tool,
#   each carrying that tool's derive. schemars 1 also stays apart from the main crate, which
#   links schemars 0.8 for typify.
# - `generated-types`: deserializing the fixtures' instances into the same generated types (our
#   copy of the models), and into a copy generated with `constrained_newtypes(false)`.
#
# The models are spread over the shard crates in models/ (members of this workspace), so cargo
# compiles them in parallel; see models/gen.
#
# Enable exactly one feature per build, except `reverse-codegen` and `generated-types`, which
# share our copy of the models and build together. This crate is its own workspace (not a member
# of the repository's), so `make test` and `make lint` never build it; `make benchmark` builds
# `generated-types`, and `make benchmark_full` every feature.

[package]
name = "json-schema-rs-benchmark-isolated"
description = "Benchmark competitors built apart from json-schema-rs-benchmark. Not published."
version = "0.0.6"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
corvus = ["dep:corvus-json-schema"]
jsonschema-macros = ["dep:jsonschema"]
reverse-codegen = [
    "dep:json-schema-rs",
    "dep:schemars",
    "dep:models-shard-0",
    "models-shard-0/reverse-codegen",
    "dep:models-shard-1",
    "models-shard-1/reverse-codegen",
    "dep:models-shard-2",
    "models-shard-2/reverse-codegen",
    "dep:models-shard-3",
    "models-shard-3/reverse-codegen",
    "dep:models-shard-4",
    "models-shard-4/reverse-codegen",
    "dep:models-shard-5",
    "models-shard-5/reverse-codegen",
    "dep:models-shard-6",
    "models-shard-6/reverse-codegen",
    "dep:models-shard-7",
    "models-shard-7/reverse-codegen",
]
generated-types = [
    "dep:models-shard-0",
    "models-shard-0/generated-types",
    "dep:models-shard-1",
    "models-shard-1/generated-types",
    "dep:models-shard-2",
    "models-shard-2/generated-types",
    "dep:models-shard-3",
    "models-shard-3/generated-types",
    "dep:models-shard-4",
    "models-shard-4/generated-types",
    "dep:models-shard-5",
    "models-shard-5/generated-types",
    "dep:models-shard-6",
    "models-shard-6/generated-types",
    "dep:models-shard-7",
    "models-shard-7/generated-types",
]

[[bin]]
name = "isolated_heap_profile"
path = "src/bin/isolated_heap_profile.rs"

# Prints one tool's reverse-codegen schema of one fixture's model, for the CLI tier.
[[bin]]
name = "reverse_schema"
path = "src/bin/reverse_schema.rs"
required-features = ["reverse-codegen"]

[[bench]]
name = "isolated"
harness = false

[dependencies]
json-schema-rs-benchmark = { path = "..", default-features = false }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
peak_alloc = "0.3"
corvus-json-schema = { version = "0.2", optional = true }
jsonschema = { version = "0.60", default-features = false, features = ["macros"], optional = true }
json-schema-rs = { path = "../../json_schema_rs", optional = true }
schemars = { version = "1.2.3", optional = true }
models-shard-0 = { path = "models/shard_0", optional = true }
models-shard-1 = { path = "models/shard_1", optional = true }
models-shard-2 = { path = "models/shard_2", optional = true }
models-shard-3 = { path = "models/shard_3", optional = true }
models-shard-4 = { path = "models/shard_4", optional = true }
models-shard-5 = { path = "models/shard_5", optional = true }
models-shard-6 = { path = "models/shard_6", optional = true }
models-shard-7 = { path = "models/shard_7", optional = true }

[build-dependencies]
json-schema-rs-benchmark = { path = "..", default-features = false }
jsonschema = { version = "0.60", default-features = false, optional = true }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
