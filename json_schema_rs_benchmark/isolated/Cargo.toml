# Benchmark competitors that must be built apart from the main benchmark crate, each in a build
# of its own (see design.md, *Benchmark harness*):
#
# - `corvus`: corvus-json-schema turns on serde_json's `preserve_order`, which Cargo would also
#   turn on for json-schema-rs and every other tool if they shared a build.
# - `jsonschema-macros`: jsonschema's compile-time validators, one per fixture, generated by
#   build.rs from the fixture set, which only exists once the driver has generated it.
# - `reverse-codegen`: reverse codegen (Rust types -> JSON Schema) by our `ToJsonSchema` derive and
#   by schemars, on models build.rs generates from the fixture set with our codegen: one copy per
#   tool, each carrying that tool's derive. schemars 1 also stays apart from the main crate,
#   which links schemars 0.8 for typify.
#
# Enable exactly one feature per build. This crate is its own workspace (not a member of the
# repository's), so `make test` and `make lint` never build it; `make benchmark` does.

[package]
name = "json-schema-rs-benchmark-isolated"
description = "Benchmark competitors built apart from json-schema-rs-benchmark. Not published."
version = "0.0.6"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
corvus = ["dep:corvus-json-schema"]
jsonschema-macros = ["dep:jsonschema"]
reverse-codegen = [
    "dep:json-schema-rs",
    "dep:json-schema-rs-macro",
    "dep:schemars",
    "dep:serde",
    "dep:syn",
    "dep:prettyplease",
    "dep:quote",
]

[[bin]]
name = "isolated_heap_profile"
path = "src/bin/isolated_heap_profile.rs"

# Prints one tool's reverse-codegen schema of one fixture's model, for the CLI tier.
[[bin]]
name = "reverse_schema"
path = "src/bin/reverse_schema.rs"
required-features = ["reverse-codegen"]

[[bench]]
name = "isolated"
harness = false

[dependencies]
json-schema-rs-benchmark = { path = "..", default-features = false }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
peak_alloc = "0.3"
corvus-json-schema = { version = "0.2", optional = true }
jsonschema = { version = "0.60", default-features = false, features = ["macros"], optional = true }
json-schema-rs = { path = "../../json_schema_rs", optional = true }
json-schema-rs-macro = { path = "../../json_schema_rs_macro", optional = true }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[build-dependencies]
json-schema-rs-benchmark = { path = "..", default-features = false }
jsonschema = { version = "0.60", default-features = false, optional = true }
serde_json = "1.0.149"
json-schema-rs = { path = "../../json_schema_rs", optional = true }
syn = { version = "3", features = ["full", "visit-mut"], optional = true }
prettyplease = { version = "0.3", optional = true }
quote = { version = "1", optional = true }

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
