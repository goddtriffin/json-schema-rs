# Generator of the benchmark's models, the build-dependency of every model shard crate
# (../shard_<n>). See src/lib.rs.

[package]
name = "model-gen"
description = "Generates the benchmark's models. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
json-schema-rs-benchmark.workspace = true
json-schema-rs.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
prettyplease.workspace = true
quote.workspace = true

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
