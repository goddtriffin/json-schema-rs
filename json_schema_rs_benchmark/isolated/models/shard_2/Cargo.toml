# Benchmark model shard 2 of 8 (see ../gen/src/lib.rs). Every shard shares one build script and
# library source; the build script reads the shard number from the package name, and the models
# it writes from the features (the same on every shard: isolated/ enables them on all eight).

[package]
name = "models-shard-2"
description = "Benchmark models, shard 2. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "../shard_build.rs"

[features]
reverse-codegen = ["dep:schemars"]
generated-types = ["dep:json-schema-rs-benchmark"]

[lib]
path = "../shard_lib.rs"

[dependencies]
json-schema-rs.workspace = true
json-schema-rs-macro.workspace = true
schemars = { workspace = true, optional = true }
json-schema-rs-benchmark = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[build-dependencies]
model-gen.workspace = true

[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
