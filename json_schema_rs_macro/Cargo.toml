[package]
name = "json-schema-rs-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Procedural macro json_schema_to_rust! for json-schema-rs"
license-file.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"
proc-macro = true

[features]
uuid = ["dep:uuid", "json-schema-rs/uuid"]
indexmap = ["json-schema-rs/indexmap"]
# Codegen inside the macro reads schema numbers exactly beyond 64 bits.
arbitrary-precision = ["json-schema-rs/arbitrary-precision"]

[lints]
workspace = true

[dependencies]
json-schema-rs.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# Generated `IndexSet` fields derive serde.
indexmap = { workspace = true, features = ["serde"] }
# Line and column of spans outside a compiler run, so unit tests can check where an error points.
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
